<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>구매 안내</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #212121;
      --side: #181818;
      --side-hover: #212121;
      --line: #3e3e3e;
      --text: #ececec;
      --muted: #b4b4b4;
      --dim: #8f8f8f;
      --composer: #303030;
      --bubble: #2f2f2f;
      --blue: #3c82f6;
      --blue-2: #2563eb;
      --warn: #e6c07b;
      --danger: #f0a8a8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app { display: flex; height: 100%; }
    .sidebar {
      width: 260px;
      background: var(--side);
      display: flex;
      flex-direction: column;
      padding: 10px 8px 12px;
      flex-shrink: 0;
    }
    .side-top { display: flex; gap: 6px; margin-bottom: 6px; }
    .icon-btn, .nav-item, .hist-item, .new-chat {
      border: 0; background: transparent; color: var(--text);
      font: inherit; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 10px;
      width: 100%; border-radius: 10px;
    }
    .icon-btn {
      width: 40px; height: 40px; justify-content: center; flex: 0 0 40px;
    }
    .icon-btn:hover, .nav-item:hover, .hist-item:hover, .new-chat:hover {
      background: var(--side-hover);
    }
    .new-chat { padding: 10px 10px; font-weight: 600; }
    .nav { display: grid; gap: 2px; padding: 4px 0 10px; }
    .nav-item { padding: 9px 10px; font-size: 14px; color: #d7d7d7; }
    .nav svg, .new-chat svg, .icon-btn svg, .user-row svg { flex-shrink: 0; }
    .hist-label {
      font-size: 11px; color: var(--dim); padding: 8px 10px 4px; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .side-search { padding: 0 2px 6px; }
    .side-search input {
      width: 100%; background: var(--composer); border: 1px solid var(--line);
      color: var(--text); font: inherit; font-size: 14px;
      border-radius: 10px; padding: 8px 10px;
    }
    .side-search input:focus { outline: none; border-color: #5a5a5a; }
    .edit-btn {
      border: 0; background: transparent; color: var(--dim);
      font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
      padding: 3px 7px; border-radius: 7px;
    }
    .edit-btn:hover { color: var(--text); background: #2a2a2a; }
    .sel-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 10px 8px; font-size: 12px; color: var(--muted);
    }
    .sel-bar[hidden] { display: none; }
    .sel-all { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .sel-all:hover { color: var(--text); }
    .sel-count { color: var(--dim); }
    .sel-count.on { color: var(--text); font-weight: 600; }
    .hist-check {
      appearance: none; -webkit-appearance: none;
      width: 17px; height: 17px; margin: 0 0 0 8px; flex-shrink: 0;
      border: 1.5px solid #575757; border-radius: 5px;
      background: #262626 no-repeat center / 11px 11px;
      cursor: pointer; display: inline-block; position: relative;
      transition: background-color .12s ease, border-color .12s ease;
    }
    .hist-check:hover { border-color: #7d7d7d; }
    .hist-check:checked {
      background-color: var(--blue); border-color: var(--blue);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'><path d='M5 12.5l4.5 4.5L19 7'/></svg>");
    }
    .hist-check:indeterminate {
      background-color: var(--blue); border-color: var(--blue);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round'><path d='M6 12h12'/></svg>");
    }
    .hist-check:focus-visible {
      outline: 2px solid rgba(60, 130, 246, .55); outline-offset: 2px;
    }
    .history { flex: 1; overflow: auto; padding-bottom: 8px; }
    .hist-row { position: relative; display: flex; align-items: center; border-radius: 10px; }
    .hist-row.picked { background: rgba(60, 130, 246, .16); }
    .hist-item {
      padding: 8px 10px; font-size: 14px; color: #d2d2d2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 34px;
    }
    .hist-item.active { background: #303030; }
    .hist-row.picked .hist-item, .hist-row.picked .hist-item.active { background: transparent; }
    .hist-empty { padding: 10px; font-size: 13px; color: #777; }
    .hist-del {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 26px; height: 26px; border: 0; border-radius: 8px;
      background: transparent; color: var(--dim); cursor: pointer;
      display: none; align-items: center; justify-content: center; padding: 0;
    }
    .hist-row:hover .hist-del { display: flex; }
    .hist-del:hover { background: #3a2a2a; color: var(--danger); }
    .sel-foot {
      display: flex; gap: 8px; padding: 8px 2px 4px;
      border-top: 1px solid #2b2b2b;
    }
    .sel-foot[hidden] { display: none; }
    .sel-foot button {
      flex: 1; border: 1px solid var(--line); background: transparent;
      color: var(--text); font: inherit; font-size: 13px; font-weight: 600;
      border-radius: 10px; padding: 9px 0; cursor: pointer;
    }
    .sel-foot .danger {
      border-color: transparent; background: #7a2f2f; color: #ffd9d9;
    }
    .sel-foot .danger:hover:not(:disabled) { background: #8f3737; }
    .sel-foot .danger:disabled { background: #2d2d2d; color: #6f6f6f; cursor: default; }
    .sel-foot .ghost:hover { background: #2a2a2a; }
    .user-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 8px; border-radius: 10px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #444; display: grid; place-items: center;
      font-size: 11px; font-weight: 800;
    }
    .user-row small { display: block; color: var(--dim); font-size: 12px; }
    .role-switch {
      display: flex; gap: 4px; margin-top: 8px;
      background: #262626; border-radius: 10px; padding: 3px; width: fit-content;
    }
    .role-switch a {
      text-decoration: none; color: var(--dim); font-size: 12px; font-weight: 650;
      padding: 6px 12px; border-radius: 8px;
    }
    .role-switch a.on { background: #3a3a3a; color: var(--text); }
    .role-switch a:hover { color: var(--text); }
    .main {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      position: relative;
    }
    .topbar {
      height: 0; display: flex; align-items: center;
      position: relative; flex-shrink: 0;
    }
    .menu-toggle {
      position: absolute; left: 12px; top: 8px;
      display: none; width: 40px; height: 40px;
    }
    .stage {
      flex: 1; overflow: auto;
      display: flex; flex-direction: column;
    }
    .stage.empty {
      justify-content: center;
      padding-bottom: 8vh;
    }
    .greet {
      text-align: center; font-size: 32px; font-weight: 600;
      letter-spacing: -0.04em; margin: 0 0 28px; line-height: 1.4;
    }
    .thread { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 16px; }
    .msg { display: flex; gap: 14px; margin: 0 0 28px; }
    .msg.user { justify-content: flex-end; }
    .bubble {
      max-width: 85%;
      background: var(--bubble);
      border-radius: 22px;
      padding: 12px 16px;
      line-height: 1.6; font-size: 16px;
    }
    .guide {
      width: 100%;
    }
    .guide-head { margin-bottom: 14px; }
    .badge { font-size: 12px; color: var(--dim); display: flex; gap: 8px; }
    .qid { font-family: ui-monospace, Consolas, monospace; }
    .matched { margin: 6px 0 0; font-size: 18px; font-weight: 650; }
    .block { margin-top: 18px; }
    .block h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 600; }
    .answer { font-size: 16px; line-height: 1.75; }
    .typing::after {
      content: "▌";
      margin-left: 1px;
      animation: caret 1s step-end infinite;
    }
    @keyframes caret { 50% { opacity: 0; } }
    .guide.anim .wait-in:not(.show) { display: none !important; }
    .answer p { margin: 0 0 10px; }
    .answer p:last-child { margin-bottom: 0; }
    .answer ol, .answer ul { margin: 0 0 10px; padding-left: 22px; }
    .answer li { margin: 4px 0; }
    .answer strong { font-weight: 700; }
    .answer code {
      font-family: ui-monospace, Consolas, monospace; font-size: 14px;
      background: #3a3a3a; border-radius: 6px; padding: 1px 5px;
    }
    .empty-note {
      color: var(--warn); font-size: 14px; line-height: 1.6;
      background: #2a281f; border-radius: 12px; padding: 12px 14px;
    }
    .forms { display: flex; flex-wrap: wrap; gap: 8px; }
    .form-btn {
      border: 1px solid var(--line); color: var(--text); text-decoration: none;
      background: #262626; border-radius: 12px; padding: 9px 12px; font-size: 13px;
    }
    .form-btn.wait { color: var(--dim); }
    .captures { display: grid; gap: 8px; }
    .shot {
      border: 1px solid #3a3a3a; border-radius: 14px; background: #262626; overflow: hidden;
    }
    .shot .n {
      width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #111;
      display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
    }
    .shot-head {
      width: 100%; display: flex; align-items: center; gap: 8px;
      border: 0; background: transparent; color: inherit; font: inherit;
      padding: 12px; cursor: pointer; text-align: left;
    }
    .shot-head:hover { background: #2e2e2e; }
    .shot-head p { margin: 0; font-size: 14px; flex: 1; }
    .shot-head .chev { color: var(--dim); font-size: 12px; transition: transform .15s ease; }
    .shot.open .chev { transform: rotate(90deg); }
    .shot-body { display: none; padding: 0 12px 12px; }
    .shot.open .shot-body { display: block; }
    .shot .ph { color: var(--dim); font-size: 12px; }
    .shot img { width: 100%; border-radius: 8px; display: block; }
    .refuse { color: var(--danger); }
    .cands { display: grid; gap: 8px; }
    .cand {
      width: 100%; text-align: left; border: 1px solid var(--line);
      background: #262626; color: var(--text); border-radius: 14px;
      padding: 12px 14px; cursor: pointer; font: inherit;
    }
    .cand:hover { border-color: #666; }
    .cand b { display: block; margin-bottom: 4px; }
    .cand span { font-size: 12px; color: var(--dim); }
    .foot { margin-top: 18px; font-size: 12px; color: var(--dim); line-height: 1.6; }
    .dots { display: flex; gap: 6px; padding: 8px 2px; }
    .dots i {
      width: 8px; height: 8px; border-radius: 50%; background: #8a8a8a;
      animation: blink 1s infinite;
    }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
    .dock {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto 8px;
    }
    .stage.empty .dock { margin-bottom: 0; }
    .composer {
      display: flex; align-items: center; gap: 6px;
      background: var(--composer);
      border: 1px solid #444;
      border-radius: 28px;
      padding: 6px 6px 6px 8px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.02);
    }
    .composer input {
      flex: 1; border: 0; outline: none; background: transparent;
      color: var(--text); font: inherit; font-size: 16px;
      padding: 10px 8px;
    }
    .composer input::placeholder { color: #9a9a9a; }
    .round {
      width: 36px; height: 36px; border-radius: 50%; border: 0;
      background: transparent; color: var(--text);
      display: grid; place-items: center; cursor: pointer;
    }
    .send {
      background: #fff; color: #111;
    }
    .send:disabled { background: #676767; color: #111; cursor: default; }
    .send.ready { background: var(--blue); color: #fff; }
    .legal {
      text-align: center; font-size: 12px; color: var(--dim);
      padding: 6px 16px 14px;
    }
    .attach-bar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px;
    }
    .attach-bar[hidden] { display: none; }
    .attach {
      display: flex; align-items: center; gap: 8px;
      background: var(--composer); border: 1px solid var(--line);
      border-radius: 12px; padding: 6px 8px 6px 6px; max-width: 260px;
    }
    .attach img {
      width: 34px; height: 34px; border-radius: 8px; object-fit: cover; display: block;
    }
    .attach .ficon {
      width: 34px; height: 34px; border-radius: 8px; background: #3a3a3a;
      display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #ddd;
    }
    .attach .fname {
      font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .attach .fsize { font-size: 11px; color: var(--dim); }
    .attach .fmeta { min-width: 0; }
    .attach .x {
      border: 0; background: transparent; color: var(--dim); cursor: pointer;
      width: 22px; height: 22px; border-radius: 6px; padding: 0; font-size: 15px; line-height: 1;
    }
    .attach .x:hover { background: #3a2a2a; color: var(--danger); }
    .attach.busy { opacity: .6; }
    .bubble .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .bubble .files a { color: #cfe0ff; font-size: 13px; text-decoration: none; }
    .bubble .files a:hover { text-decoration: underline; }
    .bubble .files img {
      max-width: 200px; max-height: 150px; border-radius: 10px; display: block; cursor: zoom-in;
    }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
    .chip {
      border: 1px solid var(--line); background: transparent; color: #d7d7d7;
      border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .chip:hover { background: #2a2a2a; }
    .err { color: var(--danger); font-size: 14px; }
    @media (max-width: 860px) {
      .sidebar { position: absolute; z-index: 8; height: 100%; transform: translateX(-100%); }
      .sidebar.open { transform: none; }
      .menu-toggle { display: grid; }
      .topbar { height: 52px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <button class="new-chat" id="newChat" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          새 채팅
        </button>
        <button class="icon-btn" id="toggleSearch" type="button" title="채팅 검색" aria-label="채팅 검색">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
        </button>
      </div>
      <div class="side-search" id="sideSearch" hidden>
        <input id="chatSearch" type="search" placeholder="채팅 검색" autocomplete="off" />
      </div>
      <nav class="nav">
        <button class="nav-item" type="button" data-q="구매요구는 어디서 하나요?">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          구매/발주
        </button>
        <button class="nav-item" type="button" data-q="착수계 작성법 알려줘">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10v18H7zM7 8h10"/></svg>
          계약
        </button>
        <button class="nav-item" type="button" data-q="경영정보에서 검수결과 등록하는 방법">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8"/><path d="M4 20h16V4"/></svg>
          검수
        </button>
        <button class="nav-item" type="button" data-q="잔금 줄 때 서류 뭐 필요해?">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>
          대금지급
        </button>
      </nav>
      <div class="hist-label">
        <span>채팅</span>
        <button class="edit-btn" id="selectMode" type="button">편집</button>
      </div>
      <div class="sel-bar" id="selBar" hidden>
        <label class="sel-all">
          <input class="hist-check" style="margin:0" type="checkbox" id="selAll" />
          전체 선택
        </label>
        <span class="sel-count" id="selCount">0개 선택</span>
      </div>
      <div class="history" id="history"></div>
      <div class="sel-foot" id="selFoot" hidden>
        <button class="ghost" id="selCancel" type="button">취소</button>
        <button class="danger" id="delSel" type="button" disabled>삭제</button>
      </div>
      <div class="user-row">
        <div class="avatar">TTA</div>
        <div>
          <input id="who" type="text" maxlength="40" placeholder="이름" style="width:140px;background:transparent;border:0;color:#ececec;font:inherit;padding:0" />
          <small>재무인프라팀</small>
          <div class="role-switch" aria-label="화면 전환">
            <a class="on" href="./index.html">Guest</a>
            <a href="./admin.html">관리자</a>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="icon-btn menu-toggle" id="openSide" type="button" aria-label="메뉴">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>

      <div class="stage empty" id="stage">
        <div class="thread" id="thread">
          <h1 class="greet" id="greet">구매 관련한 업무에 대해 궁금하시면<br>언제든지 질문해주세요</h1>
        </div>
      </div>

      <div class="dock">
        <div class="attach-bar" id="attachBar" hidden></div>
        <input id="fileInput" type="file" multiple hidden
          accept=".png,.jpg,.jpeg,.gif,.webp,.bmp,.pdf,.hwp,.hwpx,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.zip" />
        <form class="composer" id="form">
          <button class="round" id="plus" type="button" title="파일 첨부" aria-label="파일 첨부">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <input id="q" type="text" autocomplete="off" placeholder="구매 안내에게 물어보세요" />
          <button class="round send" id="go" type="submit" aria-label="보내기" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </form>
        <div class="chips" id="chips"></div>
      </div>
      <p class="legal">검증된 안내만 표시합니다. 개별 건의 적격·금액·예외는 담당 확인이 필요합니다.</p>
    </main>
  </div>

  <script src="./engine.js"></script>
  <script>
    const stage = document.getElementById("stage");
    const thread = document.getElementById("thread");
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const go = document.getElementById("go");
    const chips = document.getElementById("chips");
    const historyEl = document.getElementById("history");
    const selectBtn = document.getElementById("selectMode");
    const selBar = document.getElementById("selBar");
    const selFoot = document.getElementById("selFoot");
    const selAll = document.getElementById("selAll");
    const selCount = document.getElementById("selCount");
    const delSel = document.getElementById("delSel");
    const sideSearch = document.getElementById("sideSearch");
    const chatSearch = document.getElementById("chatSearch");
    const attachBar = document.getElementById("attachBar");
    const fileInput = document.getElementById("fileInput");
    let selectMode = false;
    let selected = new Set();
    let searchTerm = "";
    let attachments = [];
    const greet = document.getElementById("greet");

    const examples = [
      "참조견적 요청은 어떻게 해요?",
      "수의계약 금액 기준이 얼마야?",
      "완료계 양식 어디 있어?",
      "전자세금계산서 받는 메일 주소",
    ];

    let staticMode = false;
    async function ensureStatic() {
      if (!window.StaticFaq) return false;
      if (staticMode) return true;
      try {
        await window.StaticFaq.load("./data/faq.json");
        staticMode = true;
        return true;
      } catch (_) {
        return false;
      }
    }

    const who = document.getElementById("who");
    who.value = localStorage.getItem("tta-guide-user") || "";
    who.addEventListener("input", () => localStorage.setItem("tta-guide-user", who.value.trim()));

    function userName() {
      return (who.value || "").trim();
    }

    let chats = JSON.parse(localStorage.getItem("tta-guide-chats") || "[]");
    let currentId = null;

    function persistChats() {
      localStorage.setItem("tta-guide-chats", JSON.stringify(chats.slice(0, 40)));
    }

    function currentChat() {
      return chats.find((c) => c.id === currentId) || null;
    }

    function fileSize(bytes) {
      if (!bytes && bytes !== 0) return "";
      if (bytes < 1024) return `${bytes}B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)}KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)}MB`;
    }

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result));
        fr.onerror = () => reject(new Error("파일을 읽지 못했습니다"));
        fr.readAsDataURL(file);
      });
    }

    async function addFiles(files) {
      for (const file of files) {
        if (attachments.length >= 5) {
          alert("한 번에 5개까지 첨부할 수 있습니다.");
          break;
        }
        if (file.size > 15 * 1024 * 1024) {
          alert(`${file.name} 은 15MB를 넘어 첨부할 수 없습니다.`);
          continue;
        }
        const item = {
          key: Math.random().toString(36).slice(2, 9),
          name: file.name,
          size: file.size,
          image: file.type.startsWith("image/"),
          preview: file.type.startsWith("image/") ? URL.createObjectURL(file) : "",
          uploading: true,
          url: "",
        };
        attachments.push(item);
        paintAttachments();
        try {
          const dataUrl = await readAsDataUrl(file);
          if (await ensureStatic()) {
            Object.assign(item, {
              name: file.name,
              url: dataUrl,
              image: item.image,
              size: file.size,
              uploading: false,
            });
          } else {
            const res = await fetch("/api/upload", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ files: [{ name: file.name, data: dataUrl }] }),
            });
            const out = await res.json();
            if (!res.ok) throw new Error(out.error || "올리지 못했습니다");
            Object.assign(item, out.files[0], { uploading: false, preview: item.preview });
          }
        } catch (err) {
          alert(`${file.name}: ${err.message}`);
          attachments = attachments.filter((a) => a.key !== item.key);
        }
        paintAttachments();
      }
      syncSend();
    }

    function paintAttachments() {
      attachBar.hidden = attachments.length === 0;
      attachBar.innerHTML = attachments.map((a) => `
        <div class="attach${a.uploading ? " busy" : ""}">
          ${a.preview
            ? `<img src="${esc(a.preview)}" alt="${esc(a.name)}" />`
            : `<span class="ficon">${esc((a.name.split(".").pop() || "파일").slice(0, 4).toUpperCase())}</span>`}
          <span class="fmeta">
            <span class="fname">${esc(a.name)}</span>
            <span class="fsize">${a.uploading ? "올리는 중…" : esc(fileSize(a.size))}</span>
          </span>
          <button class="x" type="button" data-drop="${esc(a.key)}" aria-label="첨부 지우기">×</button>
        </div>`
      ).join("");
      attachBar.querySelectorAll("[data-drop]").forEach((b) => {
        b.onclick = () => {
          attachments = attachments.filter((a) => a.key !== b.dataset.drop);
          paintAttachments();
          syncSend();
        };
      });
    }

    function chatText(chat) {
      const parts = [chat.title];
      for (const m of chat.messages || []) {
        if (m.role === "user") parts.push(m.text || "");
        else parts.push((m.data && (m.data.question || m.data.answer)) || "");
      }
      return parts.join(" ").toLowerCase();
    }

    function visibleChats() {
      const term = searchTerm.trim().toLowerCase();
      if (!term) return chats;
      return chats.filter((c) => chatText(c).includes(term));
    }

    function paintHist() {
      const list = visibleChats();
      historyEl.innerHTML = list.map((c) => `
        <div class="hist-row${selectMode && selected.has(c.id) ? " picked" : ""}">
          ${selectMode ? `<input class="hist-check" type="checkbox" data-pick="${esc(c.id)}" ${selected.has(c.id) ? "checked" : ""} />` : ""}
          <button class="hist-item ${c.id === currentId ? "active" : ""}" type="button" data-id="${esc(c.id)}">${esc(c.title)}</button>
          ${selectMode ? "" : `<button class="hist-del" type="button" data-del="${esc(c.id)}" title="이 채팅 삭제" aria-label="이 채팅 삭제">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
          </button>`}
        </div>`
      ).join("") || `<div class="hist-empty">${chats.length ? "검색 결과가 없습니다" : "아직 채팅이 없습니다"}</div>`;
      historyEl.querySelectorAll("[data-id]").forEach((b) => {
        b.onclick = () => {
          if (selectMode) {
            togglePick(b.dataset.id);
            return;
          }
          openChat(b.dataset.id);
        };
      });
      historyEl.querySelectorAll("[data-del]").forEach((b) => {
        b.onclick = (e) => {
          e.stopPropagation();
          deleteChat(b.dataset.del);
        };
      });
      historyEl.querySelectorAll("[data-pick]").forEach((box) => {
        box.onclick = (e) => {
          e.stopPropagation();
          togglePick(box.dataset.pick);
        };
      });
      paintSelBar(list);
      selectBtn.style.display = chats.length ? "" : "none";
      selectBtn.textContent = selectMode ? "완료" : "편집";
    }

    function paintSelBar(list) {
      selBar.hidden = !selectMode;
      selFoot.hidden = !selectMode;
      if (!selectMode) return;
      const ids = list.map((c) => c.id);
      const picked = ids.filter((id) => selected.has(id)).length;
      selAll.checked = ids.length > 0 && picked === ids.length;
      selAll.indeterminate = picked > 0 && picked < ids.length;
      selCount.textContent = `${selected.size}개 선택`;
      selCount.classList.toggle("on", selected.size > 0);
      delSel.disabled = selected.size === 0;
      delSel.textContent = selected.size ? `${selected.size}개 삭제` : "삭제";
    }

    function togglePick(id) {
      if (selected.has(id)) selected.delete(id);
      else selected.add(id);
      paintHist();
    }

    function enterSelect() {
      selectMode = true;
      selected.clear();
      paintHist();
    }

    function exitSelect() {
      selectMode = false;
      selected.clear();
      paintHist();
    }

    function removeChats(ids) {
      const gone = new Set(ids);
      chats = chats.filter((c) => !gone.has(c.id));
      persistChats();
      if (gone.has(currentId)) {
        reset();
        return;
      }
      paintHist();
    }

    function deleteChat(id) {
      const chat = chats.find((c) => c.id === id);
      if (!chat) return;
      if (!confirm(`"${chat.title}" 채팅을 삭제할까요?`)) return;
      removeChats([id]);
    }

    function deleteSelected() {
      if (!selected.size) return;
      if (!confirm(`선택한 채팅 ${selected.size}개를 삭제할까요?`)) return;
      const ids = [...selected];
      selectMode = false;
      selected.clear();
      removeChats(ids);
    }

    function userBubble(text, files) {
      const list = (files || []).filter((f) => f && f.url);
      const attached = list.length
        ? `<div class="files">${list.map((f) => (f.image
            ? `<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="${esc(f.name)}" /></a>`
            : `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>`)).join("")}</div>`
        : "";
      return `<div class="msg user"><div class="bubble">${esc(text)}${attached}</div></div>`;
    }

    function renderThread(messages) {
      if (!messages || !messages.length) {
        thread.innerHTML = `<h1 class="greet" id="greet">구매 관련한 업무에 대해 궁금하시면<br>언제든지 질문해주세요</h1>`;
        stage.classList.add("empty");
        chips.style.display = "";
        return;
      }
      stage.classList.remove("empty");
      chips.style.display = "none";
      thread.innerHTML = "";
      for (const m of messages) {
        if (m.role === "user") {
          thread.insertAdjacentHTML("beforeend", userBubble(m.text, m.files));
        } else {
          thread.appendChild(guideNode(m.data));
        }
      }
      stage.scrollTop = stage.scrollHeight;
    }

    function openChat(id) {
      const chat = chats.find((c) => c.id === id);
      if (!chat) return;
      currentId = id;
      paintHist();
      renderThread(chat.messages);
      input.value = "";
      syncSend();
    }

    examples.forEach((text) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = text;
      b.onclick = () => ask(text);
      chips.appendChild(b);
    });

    document.querySelectorAll(".nav-item").forEach((b) => {
      b.onclick = () => {
        input.value = b.dataset.q;
        syncSend();
        input.focus();
      };
    });
    document.getElementById("newChat").onclick = () => reset();
    selectBtn.onclick = () => (selectMode ? exitSelect() : enterSelect());
    document.getElementById("selCancel").onclick = exitSelect;
    delSel.onclick = deleteSelected;
    selAll.onclick = () => {
      const ids = visibleChats().map((c) => c.id);
      const all = ids.length > 0 && ids.every((id) => selected.has(id));
      ids.forEach((id) => (all ? selected.delete(id) : selected.add(id)));
      paintHist();
    };
    document.getElementById("toggleSearch").onclick = () => {
      sideSearch.hidden = !sideSearch.hidden;
      if (sideSearch.hidden) {
        chatSearch.value = "";
        searchTerm = "";
        paintHist();
        return;
      }
      chatSearch.focus();
    };
    chatSearch.addEventListener("input", () => {
      searchTerm = chatSearch.value;
      paintHist();
    });
    chatSearch.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      chatSearch.value = "";
      searchTerm = "";
      sideSearch.hidden = true;
      paintHist();
    });
    document.getElementById("openSide").onclick = () => {
      document.getElementById("sidebar").classList.toggle("open");
    };
    document.getElementById("plus").onclick = () => fileInput.click();
    fileInput.addEventListener("change", () => {
      addFiles([...fileInput.files]);
      fileInput.value = "";
    });
    input.addEventListener("paste", (e) => {
      const pasted = [...(e.clipboardData?.files || [])];
      if (pasted.length) {
        e.preventDefault();
        addFiles(pasted);
      }
    });
    ["dragover", "drop"].forEach((type) => {
      document.addEventListener(type, (e) => {
        if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
        e.preventDefault();
        if (type === "drop") addFiles([...e.dataTransfer.files]);
      });
    });
    input.addEventListener("input", syncSend);
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      ask(input.value.trim());
    });

    function syncSend() {
      const ready = attachments.filter((a) => !a.uploading);
      const on = input.value.trim().length > 0 && !attachments.some((a) => a.uploading);
      go.disabled = !on;
      go.classList.toggle("ready", on);
      input.placeholder = ready.length
        ? "첨부한 파일과 함께 물어볼 내용을 적어 주세요"
        : "구매 안내에게 물어보세요";
    }

    function reset() {
      currentId = null;
      selectMode = false;
      selected.clear();
      attachments = [];
      paintAttachments();
      renderThread([]);
      input.value = "";
      syncSend();
      paintHist();
      input.focus();
    }

    function ensureChat(title) {
      if (currentId && currentChat()) return currentChat();
      currentId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const chat = { id: currentId, title: title.slice(0, 40), messages: [] };
      chats.unshift(chat);
      persistChats();
      paintHist();
      return chat;
    }

    function historyPayload(chat) {
      const prior = (chat.messages || []).slice(0, -1).slice(-8);
      return prior.map((m) => {
        if (m.role === "user") return { role: "user", text: String(m.text || "").slice(0, 300) };
        const d = m.data || {};
        return {
          role: "assistant",
          qid: d.qid || "",
          question: d.question || "",
          refused: !!d.refused,
        };
      });
    }

    async function ask(query) {
      if (!query) return;
      const files = attachments
        .filter((a) => a.url && !a.uploading)
        .map((a) => ({ name: a.name, url: a.url, image: !!a.image, size: a.size }));
      input.value = "";
      attachments = [];
      paintAttachments();
      syncSend();
      const chat = ensureChat(query);
      chat.messages.push({ role: "user", text: query, files });
      persistChats();
      stage.classList.remove("empty");
      chips.style.display = "none";
      const g = document.getElementById("greet");
      if (g) g.remove();
      thread.insertAdjacentHTML("beforeend", userBubble(query, files));
      const wait = document.createElement("div");
      wait.className = "msg";
      wait.innerHTML = `<div class="dots"><i></i><i></i><i></i></div>`;
      thread.appendChild(wait);
      stage.scrollTop = stage.scrollHeight;
      try {
        let data;
        if (await ensureStatic()) {
          data = await window.StaticFaq.ask(query, historyPayload(chat));
          window.StaticFaq.appendLog(userName(), query, data, "질문", files);
        } else {
          const res = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, user: userName(), history: historyPayload(chat), files }),
          });
          data = await res.json();
          if (!res.ok) throw new Error(data.error || "요청 실패");
        }
        const node = guideNode(data, { animate: true });
        wait.replaceWith(node);
        chat.messages.push({ role: "assistant", data });
        persistChats();
        await playTyping(node);
      } catch (err) {
        wait.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      }
      stage.scrollTop = stage.scrollHeight;
    }

    async function openGuide(qid) {
      const chat = currentChat();
      const wait = document.createElement("div");
      wait.className = "msg";
      wait.innerHTML = `<div class="dots"><i></i><i></i><i></i></div>`;
      thread.appendChild(wait);
      try {
        let data;
        if (await ensureStatic()) {
          data = await window.StaticFaq.guide(qid);
          window.StaticFaq.appendLog(
            userName(),
            (data && data.question) || qid,
            data,
            "안내선택",
            []
          );
        } else {
          const res = await fetch("/api/guide", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ qid, user: userName(), query: "" }),
          });
          data = await res.json();
        }
        const node = guideNode(data, { animate: true });
        wait.replaceWith(node);
        if (chat) {
          chat.messages.push({ role: "assistant", data });
          persistChats();
        }
        await playTyping(node);
      } catch (err) {
        wait.innerHTML = `<div class="err">${esc(err.message)}</div>`;
      }
      stage.scrollTop = stage.scrollHeight;
    }

    function typeInto(box, text, asRich) {
      const chars = Array.from(String(text || ""));
      if (!chars.length) return Promise.resolve();
      const chunk = chars.length > 280 ? 4 : chars.length > 140 ? 2 : 1;
      let i = 0;
      box.classList.add("typing");
      return new Promise((resolve) => {
        const tick = () => {
          i = Math.min(chars.length, i + chunk);
          const slice = chars.slice(0, i).join("");
          box.innerHTML = asRich ? rich(slice) : esc(slice);
          stage.scrollTop = stage.scrollHeight;
          if (i < chars.length) setTimeout(tick, 16);
          else {
            box.classList.remove("typing");
            resolve();
          }
        };
        tick();
      });
    }

    function showPart(el, pause) {
      if (!el) return Promise.resolve();
      el.classList.add("show");
      stage.scrollTop = stage.scrollHeight;
      return new Promise((resolve) => setTimeout(resolve, pause ?? 70));
    }

    async function playAll(wrap) {
      for (const el of wrap.querySelectorAll(".wait-in")) {
        await showPart(el, el.matches(".cand, .form-btn, .shot") ? 55 : 40);
        const typeBox = el.matches(".answer, .refuse, .matched") ? el : el.querySelector(".answer, .refuse, .matched");
        const raw = typeBox && typeBox.getAttribute("data-type");
        if (raw) await typeInto(typeBox, raw, typeBox.classList.contains("answer"));
      }
    }

    function playTyping(node) {
      return node && node._play ? node._play() : Promise.resolve();
    }

    function guideNode(data, opts = {}) {
      const wrap = document.createElement("div");
      wrap.className = "msg";
      const animate = !!opts.animate;
      const hold = animate ? " wait-in" : "";
      if (data.refused) {
        wrap.innerHTML = `<div class="guide${animate ? " anim" : ""}"><div class="refuse${hold}">${animate ? "" : esc(data.message)}</div></div>`;
        if (animate) {
          wrap.querySelector(".refuse").setAttribute("data-type", data.message || "");
          wrap._play = () => playAll(wrap);
        }
        return wrap;
      }
      if (data.clarify) {
        const msg = data.message || "가까운 안내가 여러 건입니다. 해당하는 항목을 골라 주세요.";
        wrap.innerHTML = `<div class="guide${animate ? " anim" : ""}">
          <div class="answer${hold}">${animate ? "" : esc(msg)}</div>
          <div class="cands">${(data.candidates || []).slice(0, 4).map((c) =>
            `<button class="cand${hold}" data-qid="${esc(c.qid)}"><b>${esc(c.question)}</b><span>${esc(c.category)}</span></button>`
          ).join("")}</div>
        </div>`;
        wrap.querySelectorAll(".cand").forEach((btn) => {
          btn.addEventListener("click", () => openGuide(btn.dataset.qid));
        });
        if (animate) {
          wrap.querySelector(".answer").setAttribute("data-type", msg);
          wrap._play = () => playAll(wrap);
        }
        return wrap;
      }
      const formItems = data.forms || [];
      const forms = formItems.map((f) => {
        const extra = animate ? " wait-in" : "";
        if (f.url) return `<a class="form-btn${extra}" href="${esc(f.url)}" download>${esc(f.name)}</a>`;
        return `<span class="form-btn wait${extra}">${esc(f.name)} · 파일 준비 중</span>`;
      }).join("");
      const formBlock = formItems.length
        ? `<div class="block${hold}"><h3>관련 양식</h3><div class="forms">${forms}</div></div>`
        : "";
      const captures = data.captures || [];
      const captureHtml = captures.length
        ? `<div class="captures">${captures.map((c) => `
            <div class="shot${hold}">
              <button class="shot-head" type="button" aria-expanded="false">
                <div class="n">${c.step}</div>
                <p>${esc(c.title)}</p>
                <span class="chev">▶</span>
              </button>
              <div class="shot-body">
                ${c.url ? `<img src="${esc(c.url)}" alt="${esc(c.title)}" />` : `<span class="ph">화면 캡처 등록 전입니다.</span>`}
              </div>
            </div>`).join("")}</div>`
        : `<p class="empty-note">경영정보 화면 캡처가 아직 등록되지 않았습니다.</p>`;
      const answer = data.answer
        ? `<div class="answer">${animate ? "" : rich(data.answer)}</div>`
        : `<div class="empty-note">질문은 찾았습니다. 구매팀이 검증한 답이 엑셀에 등록되면 이 자리에 그대로 표시됩니다. 답을 지어내지 않습니다.</div>`;
      const others = (data.candidates || []).filter((c) => c.qid !== data.qid);
      const pick = (data.ambiguous && others.length)
        ? `<div class="block${hold}"><h3>찾으신 내용이 아니면 아래 안내를 눌러 보세요.</h3>
            <div class="cands">${others.slice(0, 3).map((c) =>
              `<button class="cand${hold}" data-qid="${esc(c.qid)}"><b>${esc(c.question)}</b><span>${esc(c.category)} · ${esc(c.qid)}</span></button>`
            ).join("")}</div></div>`
        : "";
      wrap.innerHTML = `
        <div class="guide${animate ? " anim" : ""}">
          <div class="guide-head${hold}">
            <div class="badge">${esc(data.category || "구매 안내")} <span class="qid">${esc(data.qid || "")}</span></div>
            <p class="matched">${animate ? "" : esc(data.question)}</p>
          </div>
          ${pick}
          <div class="block${hold}"><h3>절차 안내</h3>${answer}</div>
          ${formBlock}
          <div class="block${hold}"><h3>경영정보 화면 안내</h3>${captureHtml}</div>
          <p class="foot${hold}">${esc(data.disclaimer || "")}<br>담당: 재무인프라팀 송민규 과장 · 010-5110-1784</p>
        </div>`;
      wrap.querySelectorAll(".cand").forEach((btn) => {
        btn.addEventListener("click", () => openGuide(btn.dataset.qid));
      });
      wrap.querySelectorAll(".shot-head").forEach((btn) => {
        btn.addEventListener("click", () => {
          const shot = btn.closest(".shot");
          const on = shot.classList.toggle("open");
          btn.setAttribute("aria-expanded", on ? "true" : "false");
        });
      });
      if (animate) {
        wrap.querySelector(".matched")?.setAttribute("data-type", data.question || "");
        wrap.querySelector(".answer")?.setAttribute("data-type", data.answer || "");
        wrap._play = () => playAll(wrap);
      }
      return wrap;
    }

    function rich(text) {
      const lines = String(text ?? "").replace(/\r/g, "").split("\n");
      const out = [];
      let list = null;
      const inline = (s) => esc(s)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
      const closeList = () => {
        if (list) { out.push(`</${list}>`); list = null; }
      };
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) { closeList(); continue; }
        const ordered = line.match(/^(\d+)[.)]\s+(.*)$/);
        const bullet = line.match(/^[-*·]\s+(.*)$/);
        if (ordered) {
          if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
          out.push(`<li>${inline(ordered[2])}</li>`);
          continue;
        }
        if (bullet) {
          if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
          out.push(`<li>${inline(bullet[1])}</li>`);
          continue;
        }
        const heading = line.match(/^#{1,6}\s+(.*)$/);
        closeList();
        out.push(`<p>${inline(heading ? heading[1] : line)}</p>`);
      }
      closeList();
      return out.join("");
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    paintHist();
    syncSend();
  </script>
</body>
</html>
