services:
  - type: web
    name: productchat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u web/server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: PYTHONUNBUFFERED
        value: "1"
